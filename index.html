<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>لعبة الحيوانات — مناسبة لطفولة المبكرة</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <header class="header">
      <h1>لعبة الحيوانات</h1>
      <p class="subtitle">اضغط على الحيوان لسماع اسمه ورؤية تأثير مرح! مناسب للأطفال الصغار.</p>
      <div class="controls" role="group" aria-label="خيارات">
        <label class="toggle">
          <input id="langToggle" type="checkbox" />
          <span class="toggle-slider"></span>
        </label>
        <span class="toggle-label">العربية / English</span>
        <button id="shuffleBtn" class="btn">رتب!</button>
        <button id="quizBtn" class="btn">اختبار بسيط</button>
      </div>
    </header>

    <section id="board" class="board" aria-live="polite"></section>

    <footer class="footer">
      <p>مصمم للأطفال الصغار — تصميم كبير، ألوان زاهية، صوت واضح.</p>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
